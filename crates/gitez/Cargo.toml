[package]
name = "gitez"
description = "A fast visual git client with local pull requests for reviewing agent-written code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "gitez"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
gitez-git.workspace = true
gitez-command.workspace = true
gitez-review.workspace = true
gitez-agent.workspace = true
anyhow.workspace = true
futures.workspace = true

[dev-dependencies]
# GPUI's test platform, to lay out and drive views in tests.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
