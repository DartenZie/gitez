[package]
name = "gitez"
description = "A fast visual git client with local pull requests for reviewing agent-written code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "gitez"
path = "src/main.rs"

[dependencies]
# `syntect` highlights code in gpui-kit's editor with the same grammars as
# gitez-highlight. Never `tree-sitter`: it replaces that highlighter.
gpui-kit = { workspace = true, features = ["syntect"] }
gitez-highlight.workspace = true
gitez-git.workspace = true
gitez-command.workspace = true
gitez-review.workspace = true
gitez-agent.workspace = true
gitez-sandbox.workspace = true
gitez-secret.workspace = true
gitez-settings.workspace = true
gitez-agent-thread.workspace = true
gitez-supervisor.workspace = true
anyhow.workspace = true
# Claude Code session ids for review prompt runs.
uuid.workspace = true
futures.workspace = true
# Watching GitEZ's data folder itself, not the thread worktrees inside it.
notify.workspace = true
# Times of agent threads, shown in local time.
jiff.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# GPUI's test platform, to lay out and drive views in tests.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# Screenshot tests (`src/screenshot.rs`): Core Text for real fonts, and PNG
# output. Both are already built for gpui-kit; keep `gpui-pre-apple` at the
# `gpui-pre` version gpui-kit pins (see CLAUDE.md, "Updating GPUI").
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { version = "=0.3.9", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
