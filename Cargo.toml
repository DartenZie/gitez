[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/gitez"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/miroslavpasek/gitez"
authors = ["Miroslav Pašek <miroslav.pasek@email.cz>"]

[workspace.dependencies]
# gpui-kit (GPUI Component) is the UI toolkit. It pins the GPUI snapshot it is
# built against (`gpui-pre` on crates.io) and re-exports it as `gpui_kit::*`,
# so GPUI itself is never listed here. Bump gpui-kit to move GPUI (see
# CLAUDE.md, "Updating GPUI").
gpui-kit = "=0.8.0"

anyhow = "1"
thiserror = "2"

# Read-only git access (writes go through the git CLI, see CLAUDE.md).
gix = { version = "0.90", default-features = false, features = ["max-performance", "revision", "blob-diff", "merge", "status", "sha1"] }

# File system events, for noticing changes made outside GitEZ.
notify = "8"
# Channels between GPUI's executors and other threads.
futures = "0.3"

tempfile = "3"

# The folders GitEZ keeps its own data in, such as the recent repositories.
dirs = "6"

# Local pull requests: stored as JSON, with RFC 3339 times.
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Syntax highlighting: bat's grammars on syntect, with the versions and
# features gpui-kit's own highlighter uses, so both share one build.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

# Secret values in the OS keychain: Keychain Services on macOS, the Secret
# Service (pure-Rust zbus) on Linux. The default `v1` feature picks the store.
keyring = "4.2.0"
# Copy-on-write clones of cache folders (APFS clonefile, Linux FICLONE).
reflink-copy = "0.1.32"
# Process groups, signals and setsid without unsafe code: the agent's
# process group, and a git that never finishes ended together with the
# processes it started.
rustix = { version = "1.1.6", features = ["process"] }
# SIGTERM to the supervisor ends the agent's turn cleanly.
signal-hook = "0.4.6"
# Images given to an agent: base64 in Claude Code's stream-JSON input, and
# decoding, downscaling and converting pasted images. Both are already built
# for GPUI; `image` with the formats GitEZ reads (GPUI enables more).
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Claude Code session ids.
uuid = { version = "1.29.2", features = ["v4"] }

gitez-git = { path = "crates/gitez-git" }
gitez-command = { path = "crates/gitez-command" }
gitez-review = { path = "crates/gitez-review" }
gitez-agent = { path = "crates/gitez-agent" }
gitez-highlight = { path = "crates/gitez-highlight" }
gitez-sandbox = { path = "crates/gitez-sandbox" }
gitez-secret = { path = "crates/gitez-secret" }
gitez-settings = { path = "crates/gitez-settings" }
gitez-agent-thread = { path = "crates/gitez-agent-thread" }
gitez-supervisor = { path = "crates/gitez-supervisor" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# GPUI is unusably slow in an unoptimized build; optimise dependencies even in dev.
[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"
